<?xml version="1.0" encoding="UTF-8"?>
<!-- fig1_as_is.svg — Cenário as is (guia p. 15, cap3.tex Figura 1).
     Notação BPMN conforme Dumas et al. (2018): pool = participante; tarefa =
     retângulo arredondado; evento = círculo; fluxo de sequência = seta cheia
     (dentro de um pool); fluxo de mensagem = seta tracejada (entre pools).
     Fonte do conteúdo: Lawless, Schoeffer e Udell (2025) — seis estágios
     (elicitação, tratamento de dados, desenvolvimento, implementação,
     validação, implantação) distribuídos entre Gestor e Especialista, com
     transferência em cada fronteira (auditoria/citekeys_cap3.md: lawless2025)
     e retorno a estágio anterior como regra, não exceção (metodologia_cap3.md
     linha 13). Monocromático, impressão em preto e branco. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 535" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <marker id="msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="none" stroke="#000000" stroke-width="1"/>
    </marker>
  </defs>

  <!-- título -->
  <text x="600" y="24" text-anchor="middle" font-size="16" font-weight="bold">Cenário as is — fluxo de modelagem com transferência entre gestor e especialista</text>

  <!-- Pool Gestor -->
  <rect x="30" y="45" width="1140" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="30" y="45" width="34" height="150" fill="#e8e8e8" stroke="#000000" stroke-width="1.5"/>
  <text x="47" y="120" text-anchor="middle" font-size="13" font-weight="bold" transform="rotate(-90 47 120)">GESTOR</text>

  <!-- Pool Especialista -->
  <rect x="30" y="215" width="1140" height="270" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <rect x="30" y="215" width="34" height="270" fill="#e8e8e8" stroke="#000000" stroke-width="1.5"/>
  <text x="47" y="350" text-anchor="middle" font-size="13" font-weight="bold" transform="rotate(-90 47 350)">ESPECIALISTA EM PO</text>

  <!-- ===== Raia Gestor ===== -->
  <!-- evento de início -->
  <circle cx="120" cy="120" r="16" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="120" y="146" text-anchor="middle" font-size="10">Início</text>

  <!-- tarefa: descrever problema -->
  <rect x="175" y="95" width="150" height="50" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="250" y="115" text-anchor="middle" font-size="12">Descrever</text>
  <text x="250" y="131" text-anchor="middle" font-size="12">problema</text>

  <!-- tarefa: usar resultado e decidir -->
  <rect x="870" y="95" width="180" height="50" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="960" y="115" text-anchor="middle" font-size="12">Usar resultado</text>
  <text x="960" y="131" text-anchor="middle" font-size="12">e decidir (caixa mágica)</text>

  <!-- evento de fim -->
  <circle cx="1105" cy="120" r="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <circle cx="1105" cy="120" r="11" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="1105" y="146" text-anchor="middle" font-size="10">Fim</text>

  <!-- sequência gestor -->
  <line x1="136" y1="120" x2="173" y2="120" stroke="#000000" stroke-width="1.5" marker-end="url(#seq)"/>
  <line x1="1050" y1="120" x2="1087" y2="120" stroke="#000000" stroke-width="1.5" marker-end="url(#seq)"/>

  <!-- ===== Raia Especialista ===== -->
  <!-- tarefa: elicitar e interpretar -->
  <rect x="175" y="320" width="150" height="55" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="250" y="343" text-anchor="middle" font-size="12">Elicitar e</text>
  <text x="250" y="359" text-anchor="middle" font-size="12">interpretar</text>

  <!-- tarefa: tratar dados -->
  <rect x="355" y="320" width="130" height="55" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="420" y="343" text-anchor="middle" font-size="12">Tratar</text>
  <text x="420" y="359" text-anchor="middle" font-size="12">dados</text>

  <!-- tarefa: desenvolver modelo -->
  <rect x="515" y="320" width="150" height="55" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="590" y="343" text-anchor="middle" font-size="12">Desenvolver</text>
  <text x="590" y="359" text-anchor="middle" font-size="12">modelo</text>

  <!-- tarefa: implementar e executar -->
  <rect x="695" y="320" width="160" height="55" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="775" y="343" text-anchor="middle" font-size="12">Implementar</text>
  <text x="775" y="359" text-anchor="middle" font-size="12">e executar</text>

  <!-- tarefa: validar -->
  <rect x="885" y="320" width="180" height="55" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="975" y="343" text-anchor="middle" font-size="12">Validar com partes</text>
  <text x="975" y="359" text-anchor="middle" font-size="12">interessadas (manual)</text>

  <!-- sequência especialista -->
  <line x1="325" y1="347" x2="353" y2="347" stroke="#000000" stroke-width="1.5" marker-end="url(#seq)"/>
  <line x1="485" y1="347" x2="513" y2="347" stroke="#000000" stroke-width="1.5" marker-end="url(#seq)"/>
  <line x1="665" y1="347" x2="693" y2="347" stroke="#000000" stroke-width="1.5" marker-end="url(#seq)"/>
  <line x1="855" y1="347" x2="883" y2="347" stroke="#000000" stroke-width="1.5" marker-end="url(#seq)"/>

  <!-- laço de retorno: validar -> desenvolver modelo (iteração, regra e não exceção) -->
  <path d="M 975,318 C 975,270 590,270 590,318" fill="none" stroke="#000000" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#seq)"/>
  <text x="782" y="266" text-anchor="middle" font-size="10" font-style="italic">retorno a estágio anterior (regra, não exceção)</text>

  <!-- fluxos de mensagem (transferências entre raias) -->
  <line x1="250" y1="145" x2="250" y2="318" stroke="#000000" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#msg)"/>
  <text x="258" y="235" font-size="10" font-style="italic">transferência</text>
  <line x1="975" y1="320" x2="960" y2="147" stroke="#000000" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#msg)"/>
  <text x="998" y="235" font-size="10" font-style="italic">transferência</text>

  <!-- legenda -->
  <g font-size="11">
    <line x1="200" y1="520" x2="240" y2="520" stroke="#000000" stroke-width="1.5" marker-end="url(#seq)"/>
    <text x="248" y="524">fluxo de sequência (dentro do papel)</text>
    <line x1="560" y1="520" x2="600" y2="520" stroke="#000000" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#msg)"/>
    <text x="608" y="524">fluxo de mensagem (transferência entre papéis)</text>
  </g>

</svg>
